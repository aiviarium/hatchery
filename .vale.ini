StylesPath = .vale/styles
MinAlertLevel = suggestion

# The AI-tell and voice rules are vendored in .vale/styles; Hatchery adds what's ours (asides, comma lists,
# sentence length, restating, assertions, headings).

[*.md]
BasedOnStyles = Vale, ai-tells, Voices, Hatchery
ai-tells = warning
ai-tells.EmDashUsage = error
ai-tells.OverusedVocabulary = error
ai-tells.PromotionalPuffery = error
Vale.Spelling = NO

# Licenses and vendored styles aren't ours to word.
[{**/LICENSE*,target/**,.vale/**,site/node_modules/**,site/.next/**,site/out/**,site/.source/**}]
BasedOnStyles =

# Tables put a group next to a task of the same name.
[README.md]
Vale.Repetition = NO

# The design rules of the site are copied unchanged from aiviarium/docs-base,
# which words them by its own rules.
[site/docs/design.md]
Hatchery.Lists = NO
Hatchery.Headings = NO
