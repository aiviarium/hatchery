[workspace]
resolver = "3"
members = ["crates/hatchery", "crates/hatchery-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aiviarium/hatchery"

[workspace.dependencies]
hatchery = { path = "crates/hatchery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = { version = "6.7", default-features = false, features = ["span"] }
semver = { version = "1", features = ["serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
toml = "1"
thiserror = "2"
bytes = "1"
url = "2"
ureq = "3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

# Development and test builds: line numbers in backtraces, and no debug
# information for dependencies, which makes them quicker to build and link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
